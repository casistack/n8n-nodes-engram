name: n8n Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    name: Package Registration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack Engram
        run: npm pack
      - name: Verify Engram package registration
        shell: bash
        run: |
          set -euo pipefail
          N8N_USER_FOLDER="$(mktemp -d)"
          N8N_RUNTIME="$(mktemp -d)"
          N8N_NODES_DIR="$N8N_USER_FOLDER/.n8n/nodes"
          PACKAGE_TGZ="$(ls n8n-nodes-engram-*.tgz | head -n 1)"
          mkdir -p "$N8N_NODES_DIR"
          npm install --no-audit --no-fund --prefix "$N8N_NODES_DIR" "$PWD/$PACKAGE_TGZ"
          npm install --no-audit --no-fund --prefix "$N8N_RUNTIME" n8n@2.12.3
          N8N_USER_FOLDER="$N8N_USER_FOLDER" \
          N8N_PORT=5680 \
          N8N_RUNNERS_BROKER_PORT=5681 \
          N8N_LOG_LEVEL=debug \
          N8N_DIAGNOSTICS_ENABLED=false \
          N8N_PERSONALIZATION_ENABLED=false \
            "$N8N_RUNTIME/node_modules/.bin/n8n" start > "$N8N_USER_FOLDER/n8n.log" 2>&1 &
          N8N_PID="$!"
          trap 'kill "$N8N_PID" 2>/dev/null || true' EXIT
          for _ in {1..90}; do
            if grep -q "Loaded all credentials and nodes from n8n-nodes-engram" "$N8N_USER_FOLDER/n8n.log" \
              && grep -q "n8n ready on" "$N8N_USER_FOLDER/n8n.log"; then
              grep "Loaded all credentials and nodes from n8n-nodes-engram" "$N8N_USER_FOLDER/n8n.log"
              grep "n8n ready on" "$N8N_USER_FOLDER/n8n.log"
              exit 0
            fi
            if ! kill -0 "$N8N_PID" 2>/dev/null; then
              cat "$N8N_USER_FOLDER/n8n.log"
              exit 1
            fi
            sleep 1
          done
          cat "$N8N_USER_FOLDER/n8n.log"
          exit 1
